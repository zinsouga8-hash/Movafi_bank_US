  <rect x="49" y="54" width="9" height="36" rx="2" fill="url(#favGold)" />
  <rect x="70" y="54" width="9" height="36" rx="2" fill="url(#favGold)" />
  <rect x="84" y="54" width="9" height="36" rx="2" fill="url(#favGold)" />

